[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yamato-cli"
version = "0.1.0"
description = "Experimental browser-free read-only Yamato parcel client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wright williams" }]
keywords = ["yamato", "kuroneko", "parcel-tracking", "cli", "japan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/raitoxlol/yamato-cli"
Documentation = "https://github.com/raitoxlol/yamato-cli/blob/main/docs/protocol-notes.md"
Repository = "https://github.com/raitoxlol/yamato-cli"
Issues = "https://github.com/raitoxlol/yamato-cli/issues"
Changelog = "https://github.com/raitoxlol/yamato-cli/blob/main/CHANGELOG.md"

[project.scripts]
yamato = "yamato_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["yamato_cli*"]
