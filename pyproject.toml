[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yamato-readonly-cli"
version = "0.1.0"
description = "Experimental browser-free read-only Yamato parcel client"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
yamato = "yamato_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["yamato_cli*"]
